<!DOCTYPE html>
<html>
<head>
    <title>API Documentation - Swagger UI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@3/swagger-ui.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .topbar {
            background-color: #1e1e1e;
            padding: 20px;
            color: white;
        }
        .topbar h1 {
            margin: 0;
            font-size: 28px;
        }
        .topbar p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Document Management & Collaboration API</h1>
        <p>OpenAPI 3.0 Specification</p>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@3/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Fetch the generated OpenAPI spec
            fetch('./openapi.json')
                .then(response => response.json())
                .then(spec => {
                    SwaggerUIBundle({
                        spec: spec,
                        dom_id: '#swagger-ui',
                        presets: [
                            SwaggerUIBundle.presets.apis,
                            SwaggerUIStandalonePreset
                        ],
                        layout: "BaseLayout"
                    });
                })
                .catch(error => {
                    console.error('Failed to load OpenAPI spec:', error);
                    document.getElementById('swagger-ui').innerHTML =
                        '<div style="padding: 20px; color: red;"><strong>Error:</strong> Could not load openapi.json. Make sure to run: <code>just gen-openapi</code></div>';
                });
        };
    </script>
</body>
</html>
